 // differences in independent arc trimming on opposite sides.
 if(Math.abs(Math.sin(angle*Number(shape.value)))<1e-9){
  right.setAttribute('d',mirror(left.getAttribute('d')));
  const key=shape.value+':'+Math.round(turn*36000);
  if(!symmetricTopCache.has(key)){symmetrizeTop();symmetricTopCache.set(key,nodes[0].getAttribute('d'));}
  else nodes[0].setAttribute('d',symmetricTopCache.get(key));
 }
 core.setAttribute('transform',`rotate(${turn*360} ${center[0]} ${center[1]})`);
}
// Boot choreography: device outlines become the shield, then the square loops.
const introDuration=4600,loopDuration=16800;
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*t*(t*(t*6-15)+10)};
draw(0);
const finalPaths=nodes.slice(0,3).map(node=>node.getAttribute('d'));
const svgNS='http://www.w3.org/2000/svg';
function samplePath(d,n=180){
 const helper=document.createElementNS(svgNS,'path');helper.setAttribute('d',d);helper.style.visibility='hidden';svg.append(helper);
 const total=helper.getTotalLength(),points=Array.from({length:n},(_,i)=>{const p=helper.getPointAtLength(total*i/n);return [p.x,p.y]});helper.remove();return points;
}
function rectangle(x,y,w,h,r){return `M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x+r}Q${x} ${y+h} ${x} ${y+h-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`;}
const notebook='M391 -60H863Q887 -60 887 -36V250L967 295Q975 307 949 307H305Q279 307 288 295L367 250V-36Q367 -60 391 -60Z';
const devicePaths=[notebook,rectangle(880,680,245,330,25),rectangle(150,690,158,300,26)];
// Match actual left/right shield nodes to phone/tablet positions.
for(let i=1;i<3;i++)devicePaths[i]=nodes[i].getBBox().x<627?rectangle(150,690,158,300,26):rectangle(930,675,245,330,25);
function signedArea(p){return p.reduce((sum,a,i)=>{const b=p[(i+1)%p.length];return sum+a[0]*b[1]-b[0]*a[1]},0)}
const morphs=finalPaths.map((d,i)=>{
 const target=samplePath(d),source=samplePath(devicePaths[i]);
 if(signedArea(source)*signedArea(target)<0)source.reverse();
 const normalized=points=>{const cx=points.reduce((s,p)=>s+p[0],0)/points.length,cy=points.reduce((s,p)=>s+p[1],0)/points.length;return points.map(p=>[p[0]-cx,p[1]-cy])};
 const a=normalized(source),b=normalized(target);let best=0,cost=Infinity;
 for(let k=0;k<a.length;k++){let error=0;for(let j=0;j<a.length;j++){const q=a[(j+k)%a.length];error+=(q[0]-b[j][0])**2+(q[1]-b[j][1])**2}if(error<cost){cost=error;best=k}}
 return {source:source.map((_,j)=>source[(j+best)%source.length]),target};
});
// The laptop base is part of its silhouette, so it becomes part of the shield.
// The two black navigation cutouts shrink inside their devices until closed.
const cutouts=document.createElementNS(svgNS,'g');cutouts.setAttribute('fill','#000000');
const navigation=[
 {source:rectangle(194,950,70,10,5),target:rectangle(620,980,7,180,3),device:nodes.findIndex((n,i)=>i>0&&i<3&&n.getBBox().x<627)},
 {source:rectangle(1026,965,50,10,5),target:rectangle(627,980,7,180,3),device:nodes.findIndex((n,i)=>i>0&&i<3&&n.getBBox().x>627)}
].map(item=>{const node=document.createElementNS(svgNS,'path');cutouts.append(node);return {...item,node,a:samplePath(item.source),b:samplePath(item.target)}});
svg.append(cutouts);
function morphCutouts(ms){
 for(const item of navigation){
  const t=ease((ms-1000-item.device*100)/2400);
  const origin=item.device===navigation[0].device?[229,955]:[1051,970];
  // Stay inside the moving device and close the aperture geometrically
  // before its lower contour becomes the narrow shield tip.
  const closing=ease((t-.04)/.48),scale=1-closing;
  const m=morphs[item.device];
  const centerOf=points=>points.reduce((a,p)=>[a[0]+p[0]/points.length,a[1]+p[1]/points.length],[0,0]);
  const from=centerOf(m.source),to=centerOf(m.target);
  const x=origin[0]+(to[0]-from[0])*t,y=origin[1]+(to[1]-from[1])*t;
  item.node.setAttribute('d','M'+item.a.map(p=>[x+(p[0]-origin[0])*scale,y+(p[1]-origin[1])*scale].join(' ')).join('L')+'Z');
 }
}
function renderBoot(ms){
 morphCutouts(ms);
 if(ms<introDuration){
  draw(0);
  nodes.slice(0,3).forEach((node,i)=>{
   const t=ease((ms-1000-i*100)/2400),m=morphs[i];
   const points=m.source.map((p,j)=>[p[0]*(1-t)+m.target[j][0]*t,p[1]*(1-t)+m.target[j][1]*t]);
   node.setAttribute('d',t===1?finalPaths[i]:'M'+points.map(p=>p.join(' ')).join('L')+'Z');
   node.setAttribute('fill','#F3F4F6');node.setAttribute('fill-opacity',1);
   node.setAttribute('stroke','none');node.style.opacity=1;
  });
  core.style.opacity=1;
  document.querySelector('.name').style.opacity=1;
 }else{

  nodes.slice(0,3).forEach(n=>{n.style.opacity=1;n.setAttribute('fill-opacity',1);n.setAttribute('stroke-width',0)});
  core.style.opacity=1;document.querySelector('.name').style.opacity=1;
  // Smooth start with no phase jump, then a constant 16.8-second revolution.
  const time=ms-introDuration,ramp=650;
  const motion=time<ramp?time*time/(2*ramp):time-ramp/2;
  draw(motion/loopDuration);
 }
}
let start=null,manual=false;
function tick(now){if(start===null)start=now;if(!manual)renderBoot(now-start);requestAnimationFrame(tick)}
document.querySelector('#replay').onclick=()=>{start=null;manual=false};
window.bootPreview={seek(ms){manual=true;renderBoot(ms)},play(){manual=false;start=null},introDuration,loopDuration};
renderBoot(0);requestAnimationFrame(tick);
</script></html>
