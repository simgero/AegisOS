name: AegisOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate AegisOS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AegisOS
        uses: actions/checkout@v4

      - name: System information
        run: |
          uname -a
          lscpu
          free -h
          df -h

      - name: Validate repository
        run: |
          test -d packages/aegis
          test -d security
          test -d docs/architecture
          echo "AegisOS repository structure OK"

      - name: Install disk and archive test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils e2fsprogs erofs-utils cpio lz4

      - name: Validate build scripts
        run: |
          sh -n build.sh
          bash -n scripts/aosp/worker.sh
          bash -n scripts/aosp/compile.sh
          bash -n scripts/aosp/check-identity.sh
          bash -n scripts/start-components.sh
          bash -n scripts/export-components.sh
          sh -n packages/aegis/identity/cli/aegis
          bash -n scripts/aosp/setup-sandbox.sh
          bash -n scripts/aosp/config.sh
          bash -n scripts/kernel/build.sh
          bash -n scripts/runtime/build-base.sh
          bash -n scripts/check-environment.sh
          bash -n scripts/prepare-builder.sh
          bash -n scripts/export-secure-env.sh
          bash -n tools/qemu/adb-bridge.sh
          python3 scripts/kernel/source_manifest.py kernel/manifest.xml
          python3 scripts/runtime/uid_layout.py check

      - name: Validate helper init source
        run: clang -target aarch64-linux-gnu -ffreestanding -fno-builtin -fsyntax-only -Wall -Wextra -Werror tools/secure-env/init.c

      - name: Test build and upload state machine
        run: python3 -B -m unittest discover -s tests -v
