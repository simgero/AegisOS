name: AegisOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate AegisOS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AegisOS
        uses: actions/checkout@v4

      - name: System information
        run: |
          uname -a
          lscpu
          free -h
          df -h

      - name: Validate repository
        run: |
          test -d packages/aegis
          test -d security
          test -d docs/architecture
          echo "AegisOS repository structure OK"

      - name: Validate build scripts
        run: |
          sh -n build.sh
          bash -n scripts/aosp/worker.sh
          bash -n scripts/aosp/compile.sh
          bash -n scripts/aosp/setup-sandbox.sh
          bash -n scripts/aosp/config.sh
          bash -n scripts/check-environment.sh
          bash -n scripts/prepare-builder.sh

      - name: Test build and upload state machine
        run: python3 -B -m unittest discover -s tests -v
